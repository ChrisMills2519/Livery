<!-- ginger-splash: the branded loading screen.  Source of truth for the markup is
     this file; tools/export_web_mobile.py injects it in place of Godot's stock
     splash image and progress bar, and tools/web_shell/preview.html loads it so
     the screen can be reviewed without a 122 MiB download.  The progress element
     keeps its stock id, so Godot's own shell still drives it. -->
			<div id="ginger-splash">
				<img id="ginger-logo" src="branding-ginger-games.png" alt="Ginger Games">
				<div id="ginger-stage">
					<img id="ginger-livery" src="branding-livery.png" alt="">
				</div>
				<div id="ginger-load">
					<div id="ginger-bar">
						<progress id="status-progress"></progress>
						<svg id="ginger-puller" viewBox="0 0 49 84" aria-hidden="true">
							<!-- The rope tip sits on the fill's leading edge, which is
							     where the puller is anchored, so the fill reads as the
							     thing he is dragging. -->
							<path class="ginger-rope" d="M2 77 Q12 74.5 20 66.5"/>
							<g id="ginger-body">
								<path class="ginger-back-arm" d="M27.5 40 L21.5 66"/>
								<path class="ginger-front-arm" d="M25 38 L20.5 67.5"/>
								<path class="ginger-torso" d="M28.5 30.5 L24 58.5"/>
								<circle class="ginger-head" cx="30" cy="22.5" r="6.6"/>
								<g class="ginger-leg-back">
									<path d="M24 58.5 L19.5 69 L17 78.5"/>
								</g>
								<g class="ginger-leg-front">
									<path d="M24 58.5 L31 68 L33.5 78"/>
								</g>
							</g>
							<path class="ginger-foot" d="M14.5 78.6 L19.5 78.6"/>
							<path class="ginger-foot" d="M31 78.2 L35.8 78.2"/>
						</svg>
					</div>
					<div id="ginger-percent">LOADING 0%</div>
				</div>
			</div>
